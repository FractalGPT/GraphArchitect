[pytest]
# Конфигурация pytest для функциональных тестов

# Настройки вывода
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Маркеры
markers =
    e2e: End-to-end тесты полного workflow
    web_api: Тесты Web API (требуют запущенный сервер)
    integration: Интеграционные сценарии
    reliability: Тесты надежности и обработки ошибок
    performance: Тесты производительности
    slow: Медленные тесты

# Паттерны поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Минимальная версия pytest
minversion = 7.0

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(levelname)s - %(message)s

# Покрытие кода
[coverage:run]
source = grapharchitect
omit = 
    */tests/*
    */examples/*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false
