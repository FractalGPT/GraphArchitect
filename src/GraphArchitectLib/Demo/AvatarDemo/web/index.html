<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>AI Консультант</title>
  <link rel="stylesheet" href="/web/static/style.css">
</head>
<body>
  <header>
    <h1>AI Консультант</h1>
  </header>
  <main>
    <div class="chat-container">
      <div class="chat-header">
        <h2>Добро пожаловать!</h2>
        <p>Задайте свой вопрос, и я постараюсь помочь.</p>
      </div>
      <div class="messages" id="messages"></div>

      <div class="input-container">
        <textarea id="userInput" placeholder="Введите сообщение..." rows="4"></textarea>
        <button id="sendBtn">Отправить</button>
      </div>


    </div>
  </main>
  <script src="/web/static/script.js"></script>
</body>
</html>
